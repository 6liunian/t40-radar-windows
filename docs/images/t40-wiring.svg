<text x="1130" y="1003" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#52667a">PCAN DB9：2 脚</text>
<line x1="84" y1="1020" x2="1515" y2="1020" stroke="#e0e7ee" stroke-width="1"/>
<text x="90" y="1051" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#2567bc">B6 · USB D+</text>
<text x="640" y="1051" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#152c44">电脑 USB D+（经专用转接线）</text>
<text x="1130" y="1051" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#52667a">USB-A：3 脚</text>
<line x1="84" y1="1068" x2="1515" y2="1068" stroke="#e0e7ee" stroke-width="1"/>
<text x="90" y="1099" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#2567bc">B7 · USB D−</text>
<text x="640" y="1099" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#152c44">电脑 USB D−（经专用转接线）</text>
<text x="1130" y="1099" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#52667a">USB-A：2 脚</text>
<rect x="60" y="1175" width="1480" height="265" rx="14" fill="#ffffff" stroke="#d6dfe9" stroke-width="2"/>
<text x="84" y="1222" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" fill="#152c44">03  电脑端与供电要点</text>
<text x="85" y="1269" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#152c44">USB-A：2 = D−，3 = D+，4 = GND；1 = +5V，本参考接线中不连接。</text>
<text x="85" y="1312" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#bb382c">不要把电脑 USB +5V 与雷达 VCC 相连；不要按标准 USB-C VBUS 位置并脚。</text>
<text x="85" y="1354" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#152c44">PCAN-USB：DB9 7 = CAN H，2 = CAN L，3/6 = CAN GND；1/9 不给雷达供电。</text>
<text x="85" y="1397" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#52667a">CAN 设置 1 Mbps。核对两端终端电阻；已有终端时不要重复并接。</text>
<rect x="60" y="1464" width="1480" height="164" rx="14" fill="#eef4fc" stroke="#bdd0e6" stroke-width="2"/>
<text x="84" y="1508" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#152c44">电源与实物核对</text>
<text x="84" y="1549" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#152c44">原作者资料提到 15V；本项目此前使用 12V / 3A。两者不能互相作为额定规格证明。</text>
<text x="84" y="1591" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#152c44">以设备铭牌、原厂资料与转接板标识为准；本图未对你的实际插头方向逐针实测。</text>
<text x="65" y="1675" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#52667a">来源：leommxj · DJI T40 RD2484R 雷达逆向分析；PEAK · PCAN-USB User Manual §4.1。</text>
