<text x="90" y="907" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#667589">A1/A5/A12、B1/B5/B12 · GND</text>
<text x="640" y="907" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#152c44">电源负极 / USB GND / CAN GND</text>
<text x="1130" y="907" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#52667a">核对实际转接板共地</text>
