<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>T40 实时点云</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e12;
      --surface: #111820;
      --surface-2: #17212b;
      --line: #263542;
      --text: #edf4f7;
      --muted: #8da1ad;
      --accent: #5fcbbb;
      --warn: #e2b66c;
      --danger: #e07a78;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
    }

    button, input { font: inherit; }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .live-state {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 13px;
    }

    .live-state[data-state="live"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); }
    .live-state[data-state="error"] { color: var(--danger); }
    .live-state[data-state="connecting"] { color: var(--warn); }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .toolbar button {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .1s ease;
    }

    .toolbar button:hover { color: var(--text); background: var(--surface-2); }
    .toolbar button:active { transform: translateY(1px); }
    .toolbar button[aria-pressed="true"] { color: var(--text); background: #244c49; border-color: #32635f; }
    .toolbar .reset { border-color: var(--line); color: var(--text); }

    .stage {
      position: relative;
      height: clamp(480px, calc(100vh - 180px), 860px);
      min-height: 480px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }

    #cloud { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #cloud:active { cursor: grabbing; }

    .metrics {
      position: absolute;
      top: 14px;
      left: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(100px, auto));
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      border-radius: 9px;
      background: color-mix(in srgb, var(--surface) 87%, transparent);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .metric { padding: 9px 12px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin-top: 3px; font-family: Consolas, monospace; font-size: 18px; }
    .metric-value span { color: var(--muted); font-size: 11px; }

    .message {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(420px, calc(100% - 36px));
      padding: 16px 18px;
      transform: translate(-50%, -50%);
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--warn);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      text-align: center;
      pointer-events: none;
    }

    .message[hidden] { display: none; }

    .view-status {
      position: absolute;
      right: 14px;
      bottom: 14px;
      max-width: min(480px, calc(100% - 28px));
      padding: 7px 10px;
      border-radius: 7px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      font-size: 12px;
      pointer-events: none;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .bottom-bar > * { min-width: 0; max-width: 100%; }

    .size-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 260px;
    }

    .size-control input { width: min(260px, 35vw); accent-color: var(--accent); }

    .calibration {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .calibration label { display: inline-flex; align-items: center; gap: 7px; }

    .calibration select,
    .calibration input,
    .calibration button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface-2);
    }

    .calibration select { padding: 5px 28px 5px 9px; }
    .calibration input { width: 78px; padding: 5px 8px; }
    .calibration button { padding: 5px 10px; cursor: pointer; }
    .calibration button:hover { border-color: #3a554f; }
    .calibration button:disabled, .calibration input:disabled { opacity: .45; cursor: default; }
    #calibration-status { color: var(--accent); }
    #data-note { overflow-wrap: anywhere; }

    @media (max-width: 720px) {
      .shell { padding: 12px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .stage { height: 560px; }
      .metrics {
        width: calc(100% - 28px);
        max-width: 310px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        right: auto;
      }
      .metric { padding: 8px; }
      .metric-label, .metric-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .metric-value { font-size: 15px; }
      .bottom-bar { align-items: stretch; flex-direction: column; }
      .calibration {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: flex-start;
        width: 100%;
      }
      .calibration label { justify-content: space-between; width: 100%; }
      .calibration select { width: min(190px, 62vw); }
      .calibration input { margin-left: auto; }
      .calibration button { justify-self: start; }
      .size-control { min-width: 0; }
      .size-control input { flex: 1; width: auto; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .metrics, .message, .view-status { background: var(--surface); backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="title-row">
          <h1>T40 实时点云</h1>
          <span class="live-state" id="live-state" data-state="waiting">等待</span>
        </div>
        <div class="subtitle">真实完整扇区回波 / 只读网页伴侣</div>
      </div>
      <nav class="toolbar" aria-label="三维视角">
        <button type="button" data-view="perspective" aria-pressed="true">透视</button>
        <button type="button" data-view="top" aria-pressed="false">俯视</button>
        <button type="button" data-view="front" aria-pressed="false">前视</button>
        <button type="button" data-view="side" aria-pressed="false">侧视</button>
        <button class="reset" type="button" data-action="reset">复位</button>
      </nav>
    </header>

    <section class="stage" id="stage" aria-label="T40 实时三维点云">
      <canvas id="cloud"></canvas>
      <div class="metrics" aria-live="polite">
        <div class="metric"><div class="metric-label">实时点数</div><div class="metric-value" id="point-count">0</div></div>
        <div class="metric"><div class="metric-label">实际转速</div><div class="metric-value" id="rpm">0 <span>RPM</span></div></div>
        <div class="metric"><div class="metric-label">读取耗时</div><div class="metric-value" id="read-time">0.00 <span>s</span></div></div>
      </div>
      <div class="message" id="message">等待 T40 雷达控制台</div>
      <div class="view-status" id="view-status">左键旋转 / 右键平移 / 滚轮缩放 / 双击聚焦</div>
    </section>

    <footer class="bottom-bar">
      <div class="size-control">
        <label for="point-size">点大小</label>
        <input id="point-size" type="range" min="2" max="10" step="0.1" value="5">
        <output id="point-size-value" for="point-size">5.0</output>
      </div>
      <div class="calibration">
        <label for="height-mode">高度基准
          <select id="height-mode">
            <option value="ground" selected>当前地面归零</option>
            <option value="radar">雷达测高</option>
            <option value="manual">手动安装高度</option>
            <option value="relative">相对雷达</option>
          </select>
        </label>
        <label for="manual-height">安装高度
          <input id="manual-height" type="number" min="-20" max="50" step="0.05" value="0" disabled>
          <span>m</span>
        </label>
        <button id="ground-calibrate" type="button">重新取地面</button>
        <output id="calibration-status">等待真实点云</output>
      </div>
      <div id="data-note">真实俯仰角参与计算，无效俯仰点不参与校准。</div>
    </footer>
  </main>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.180.0";
    import { OrbitControls } from "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";

    const stage = document.getElementById("stage");
    const canvas = document.getElementById("cloud");
    const liveState = document.getElementById("live-state");
    const message = document.getElementById("message");
    const pointCount = document.getElementById("point-count");
    const rpm = document.getElementById("rpm");
    const readTime = document.getElementById("read-time");
    const viewStatus = document.getElementById("view-status");
    const sizeInput = document.getElementById("point-size");
    const sizeValue = document.getElementById("point-size-value");
    const heightMode = document.getElementById("height-mode");
    const manualHeight = document.getElementById("manual-height");
    const groundCalibrate = document.getElementById("ground-calibrate");
    const calibrationStatus = document.getElementById("calibration-status");
    const dataNote = document.getElementById("data-note");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setClearColor(0x111820, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x111820, 55, 150);
    const camera = new THREE.PerspectiveCamera(44, 1, 0.1, 300);
    camera.position.set(35, 27, 38);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0, 0);
    controls.enableDamping = !reduceMotion.matches;
    controls.dampingFactor = 0.075;
    controls.rotateSpeed = 0.55;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.7;
    controls.screenSpacePanning = true;
    controls.zoomToCursor = true;
    controls.minDistance = 4;
    controls.maxDistance = 180;
    controls.minPolarAngle = 0.02;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
    controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
    controls.touches.ONE = THREE.TOUCH.ROTATE;
    controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;
    controls.update();

    const guideGroup = new THREE.Group();
    scene.add(guideGroup);
    let guideRange = 30;

    function rebuildGuides(range) {
      guideRange = Math.max(5, Math.ceil(range / 5) * 5);
      guideGroup.clear();
      const material = new THREE.LineBasicMaterial({ color: 0x526474, transparent: true, opacity: 0.34 });
      const strong = new THREE.LineBasicMaterial({ color: 0x657989, transparent: true, opacity: 0.52 });
      const step = guideRange / 5;
      for (let radius = step; radius <= guideRange + 0.001; radius += step) {
        const vertices = [];
        for (let i = 0; i <= 128; i++) {
          const angle = i / 128 * Math.PI * 2;
          vertices.push(new THREE.Vector3(Math.cos(angle) * radius, -0.02, Math.sin(angle) * radius));
        }
        guideGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(vertices), radius >= guideRange ? strong : material));
      }
      const spokes = [];
      for (let i = 0; i < 12; i++) {
        const angle = i / 12 * Math.PI * 2;
        spokes.push(0, -0.02, 0, Math.cos(angle) * guideRange, -0.02, Math.sin(angle) * guideRange);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(spokes, 3));
      guideGroup.add(new THREE.LineSegments(geometry, material));
    }
    rebuildGuides(30);

    const textureCanvas = document.createElement("canvas");
    textureCanvas.width = textureCanvas.height = 64;
    const textureContext = textureCanvas.getContext("2d");
    const dotGradient = textureContext.createRadialGradient(32, 32, 2, 32, 32, 30);
    dotGradient.addColorStop(0, "rgba(255,255,255,1)");
    dotGradient.addColorStop(0.28, "rgba(255,255,255,1)");
    dotGradient.addColorStop(0.56, "rgba(255,255,255,.92)");
    dotGradient.addColorStop(0.78, "rgba(255,255,255,.28)");
    dotGradient.addColorStop(1, "rgba(255,255,255,0)");
    textureContext.fillStyle = dotGradient;
    textureContext.fillRect(0, 0, 64, 64);
    const dotTexture = new THREE.CanvasTexture(textureCanvas);

    const pointMaterial = new THREE.PointsMaterial({
      size: Number(sizeInput.value),
      map: dotTexture,
      transparent: true,
      opacity: 0.98,
      alphaTest: 0.08,
      depthWrite: true,
      vertexColors: true,
      sizeAttenuation: false
    });
    let geometry = new THREE.BufferGeometry();
    let cloud = new THREE.Points(geometry, pointMaterial);
    scene.add(cloud);

    const focusMarker = new THREE.Mesh(
      new THREE.RingGeometry(0.3, 0.44, 48),
      new THREE.MeshBasicMaterial({ color: 0x5fcbbb, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthTest: false })
    );
    focusMarker.rotation.x = -Math.PI / 2;
    focusMarker.visible = false;
    focusMarker.renderOrder = 3;
    scene.add(focusMarker);

    const colorLow = new THREE.Color(0x7bc7ff);
    const colorMid = new THREE.Color(0x65f0c9);
    const colorHigh = new THREE.Color(0xffc477);
    const colorInvalid = new THREE.Color(0xa9b4bc);
    let cameraTween = null;
    let firstLiveFrame = true;
    let pollBusy = false;
    let latestData = null;
    let rawPoints = [];
    let groundOffset = null;
    let renderedFrameKey = "";

    function percentile(sorted, ratio) {
      if (!sorted.length) return 0;
      return sorted[Math.min(sorted.length - 1, Math.max(0, Math.floor((sorted.length - 1) * ratio)))];
    }

    function median(values) {
      const sorted = [...values].sort((a, b) => a - b);
      const middle = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
    }

    function estimateGround(points) {
      const candidates = points.filter(point => {
        const radius = Math.hypot(point[0], point[1]);
        return point[5] === 1 && radius >= 1.5 && radius <= 40 && point[2] >= -30 && point[2] <= 1;
      });
      if (candidates.length < 12) return null;
      const binSize = 0.15;
      const bins = new Map();
      for (const point of candidates) {
        const bin = Math.round(point[2] / binSize);
        bins.set(bin, (bins.get(bin) || 0) + 1);
      }
      const strongest = [...bins.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0];
      if (!strongest || strongest[1] < 6) return null;
      const center = strongest[0] * binSize;
      const surface = candidates.map(point => point[2]).filter(z => Math.abs(z - center) <= 0.24);
      if (surface.length < 6) return null;
      const groundZ = median(surface);
      return { offset: -groundZ, groundZ, samples: surface.length };
    }

    function calibrationOffset(data, points, forceGround = false) {
      const mode = heightMode.value;
      manualHeight.disabled = mode !== "manual";
      groundCalibrate.disabled = mode !== "ground";
      if (mode === "relative") {
        calibrationStatus.value = "雷达中心为 0 m";
        return 0;
      }
      if (mode === "manual") {
        const offset = Number(manualHeight.value) || 0;
        calibrationStatus.value = `安装高度 ${offset.toFixed(2)} m`;
        return offset;
      }
      if (mode === "radar") {
        const value = Number(data?.radar_height_m);
        if (Number.isFinite(value) && value > 0.05 && value < 50) {
          calibrationStatus.value = `雷达测高 ${value.toFixed(2)} m`;
          return value;
        }
        calibrationStatus.value = "雷达测高当前无效";
        return 0;
      }
      if (forceGround) groundOffset = null;
      if (groundOffset === null) groundOffset = estimateGround(points);
      if (groundOffset) {
        calibrationStatus.value = `地面 ${groundOffset.groundZ.toFixed(2)} m → 0 m / ${groundOffset.samples} 点`;
        return groundOffset.offset;
      }
      const measured = Number(data?.radar_height_m);
      if (Number.isFinite(measured) && measured > 0.05 && measured < 50) {
        calibrationStatus.value = `地面不足，采用雷达测高 ${measured.toFixed(2)} m`;
        return measured;
      }
      calibrationStatus.value = "地面点不足，暂用相对高度";
      return 0;
    }

    function updateCloud(points, forceGround = false) {
      const count = points.length;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const offset = calibrationOffset(latestData, points, forceGround);
      const heights = points.filter(point => point[5] === 1).map(point => point[2] + offset).sort((a, b) => a - b);
      const low = percentile(heights, 0.05);
      const high = Math.max(low + 0.1, percentile(heights, 0.95));
      let maxRadius = 5;
      for (let i = 0; i < count; i++) {
        const [x, y, z, _strength, _sector, elevationValid] = points[i];
        const calibratedZ = z + offset;
        positions[i * 3] = y;
        positions[i * 3 + 1] = calibratedZ;
        positions[i * 3 + 2] = x;
        maxRadius = Math.max(maxRadius, Math.hypot(x, y));
        const value = Math.max(0, Math.min(1, (calibratedZ - low) / (high - low)));
        let from = colorLow;
        let to = colorMid;
        let mix = value * 2;
        if (elevationValid !== 1) {
          from = to = colorInvalid;
          mix = 0;
        } else if (value >= 0.5) {
          from = colorMid;
          to = colorHigh;
          mix = (value - 0.5) * 2;
        }
        colors[i * 3] = from.r + (to.r - from.r) * mix;
        colors[i * 3 + 1] = from.g + (to.g - from.g) * mix;
        colors[i * 3 + 2] = from.b + (to.b - from.b) * mix;
      }
      const next = new THREE.BufferGeometry();
      next.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      next.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      next.computeBoundingSphere();
      geometry.dispose();
      geometry = next;
      cloud.geometry = geometry;
      if (Math.abs(maxRadius - guideRange) > guideRange * 0.24) rebuildGuides(maxRadius * 1.08);
      if (firstLiveFrame && count) {
        firstLiveFrame = false;
        const distance = Math.max(16, Math.min(85, maxRadius * 1.55));
        beginCameraMove(new THREE.Vector3(distance * 0.75, distance * 0.58, distance * 0.82), new THREE.Vector3(0, 0, 0), 520);
      }
      const valid = points.reduce((total, point) => total + (point[5] === 1 ? 1 : 0), 0);
      dataNote.textContent = `高度着色 / 有效俯仰 ${valid.toLocaleString("zh-CN")} / 无效 ${(count - valid).toLocaleString("zh-CN")}`;
    }

    const views = {
      perspective: { position: () => new THREE.Vector3(guideRange * 1.05, guideRange * 0.8, guideRange * 1.15), target: new THREE.Vector3(), label: "透视" },
      top: { position: () => new THREE.Vector3(0.01, guideRange * 1.9, 0.01), target: new THREE.Vector3(), label: "俯视" },
      front: { position: () => new THREE.Vector3(0, guideRange * 0.32, guideRange * 1.75), target: new THREE.Vector3(), label: "前视" },
      side: { position: () => new THREE.Vector3(guideRange * 1.75, guideRange * 0.32, 0), target: new THREE.Vector3(), label: "侧视" }
    };

    function beginCameraMove(position, target, duration = 460) {
      if (reduceMotion.matches) {
        camera.position.copy(position);
        controls.target.copy(target);
        controls.update();
        return;
      }
      cameraTween = {
        start: performance.now(), duration,
        fromPosition: camera.position.clone(), toPosition: position.clone(),
        fromTarget: controls.target.clone(), toTarget: target.clone()
      };
    }

    function moveView(name) {
      const view = views[name];
      if (!view) return;
      document.querySelectorAll("[data-view]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.view === name)));
      focusMarker.visible = false;
      viewStatus.textContent = `${view.label}视角 / 左键旋转 / 右键平移 / 滚轮缩放`;
      beginCameraMove(view.position(), view.target);
    }

    document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => moveView(button.dataset.view)));
    document.querySelector("[data-action='reset']").addEventListener("click", () => moveView("perspective"));
    controls.addEventListener("start", () => {
      cameraTween = null;
      document.querySelectorAll("[data-view]").forEach(button => button.setAttribute("aria-pressed", "false"));
      viewStatus.textContent = "自由视角 / 左键旋转 / 右键平移 / 滚轮缩放 / 双击聚焦";
    });

    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.65;
    const pointer = new THREE.Vector2();
    canvas.addEventListener("dblclick", event => {
      const bounds = canvas.getBoundingClientRect();
      pointer.x = (event.clientX - bounds.left) / bounds.width * 2 - 1;
      pointer.y = -(event.clientY - bounds.top) / bounds.height * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(cloud, false)[0];
      if (!hit) return;
      const target = hit.point.clone();
      const offset = camera.position.clone().sub(controls.target).setLength(Math.max(7, Math.min(24, camera.position.distanceTo(controls.target) * 0.68)));
      focusMarker.position.copy(target);
      focusMarker.position.y += 0.02;
      focusMarker.visible = true;
      viewStatus.textContent = `聚焦：X ${target.z.toFixed(1)} / Y ${target.x.toFixed(1)} / Z ${target.y.toFixed(1)} m`;
      beginCameraMove(target.clone().add(offset), target);
    });

    sizeInput.addEventListener("input", () => {
      const value = Number(sizeInput.value);
      sizeValue.value = value.toFixed(1);
      pointMaterial.size = value;
    });

    heightMode.addEventListener("change", () => {
      if (heightMode.value === "ground") groundOffset = null;
      updateCloud(rawPoints);
    });
    manualHeight.addEventListener("input", () => updateCloud(rawPoints));
    groundCalibrate.addEventListener("click", () => updateCloud(rawPoints, true));

    function updateStatus(data) {
      latestData = data;
      rawPoints = Array.isArray(data.points) ? data.points : [];
      liveState.dataset.state = data.state;
      liveState.textContent = ({ live: "实时", connecting: "连接中", error: "待恢复", waiting: "等待" })[data.state] || data.state;
      pointCount.textContent = Number(data.point_count || 0).toLocaleString("zh-CN");
      rpm.innerHTML = `${Number(data.rpm || 0).toLocaleString("zh-CN")} <span>RPM</span>`;
      readTime.innerHTML = `${Number(data.read_seconds || 0).toFixed(2)} <span>s</span>`;
      const live = data.state === "live" && data.point_count > 0;
      message.hidden = live;
      message.textContent = data.message || "等待真实点云";
      const frameKey = `${data.state}|${Number(data.updated || 0)}|${rawPoints.length}`;
      if (frameKey !== renderedFrameKey) {
        renderedFrameKey = frameKey;
        updateCloud(rawPoints);
      }
    }

    async function poll() {
      if (pollBusy) return;
      pollBusy = true;
      try {
        const response = await fetch(`/api/points?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        updateStatus(await response.json());
      } catch (error) {
        updateStatus({ state: "error", message: `网页伴侣连接失败：${error.message}`, points: [], point_count: 0, rpm: 0, read_seconds: 0 });
      } finally {
        pollBusy = false;
      }
    }
    poll();
    setInterval(poll, 1100);

    function resize() {
      const width = Math.max(1, stage.clientWidth);
      const height = Math.max(1, stage.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    renderer.setAnimationLoop(time => {
      if (cameraTween) {
        const progress = Math.min(1, (time - cameraTween.start) / cameraTween.duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        camera.position.lerpVectors(cameraTween.fromPosition, cameraTween.toPosition, eased);
        controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, eased);
        if (progress >= 1) cameraTween = null;
      }
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
