ctrl_interface=/run/hostapd_radar
interface=wlan0
driver=nl80211
country_code=US
ssid=radar_wifi
channel=48
# ath6kl does not report station activity correctly to hostapd. Use the
# nl80211 u16 maximum so an actively streaming radar is not removed after
# hostapd's normal five-minute timeout (65535 seconds is about 18 hours).
ap_max_inactivity=65535
disassoc_low_ack=0
#ht_capab=[HT40-][SHORT-GI-20][SHORT-GI-40][40-INTOLERANT]
#rsn_preauth=1
#time_advertisement=2
#time_zone=CST8
# The legacy ath6kl AP becomes unstable when phones or laptops probe this
# open SSID with randomized MAC addresses. Admit only the radar radio.
macaddr_acl=1
accept_mac_file=/opt/t40-radar-windows/setup/radar_accept.list
auth_algs=1
ieee80211n=0
wmm_enabled=1
hw_mode=a
#ignore_broadcast_ssid=2
#wpa=2
#wpa_passphrase=12345678
#wpa_key_mgmt=WPA-PSK
#wpa_pairwise=TKIP
#rsn_pairwise=CCMP

